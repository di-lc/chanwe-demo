<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1200">
  <title>OG Image Template — Chanwe</title>
  <style>
    @import url('https://api.fontshare.com/v2/css?f[]=satoshi@400,500&f[]=archivo@600,700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background-color: #f5f4f2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      font-family: 'Satoshi', sans-serif;
    }

    .logo {
      width: 380px;
      height: auto;
    }

    .divider {
      width: 1px;
      height: 36px;
      background-color: #d1cec9;
    }

    .tagline {
      font-family: 'Archivo', sans-serif;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #1a1a1a;
      text-align: center;
    }

    .sub {
      font-family: 'Satoshi', sans-serif;
      font-size: 15px;
      font-weight: 400;
      color: #888480;
      text-align: center;
      letter-spacing: 0.02em;
    }

    .corner {
      position: absolute;
      bottom: 32px;
      right: 40px;
      font-family: 'Satoshi', sans-serif;
      font-size: 13px;
      color: #c0bdb8;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <img class="logo" src="../../02-logo/chanwe-logo-red.svg" alt="Chanwe">
  <div class="divider"></div>
  <p class="tagline">Consultoría Estratégica y Desarrollo de Negocios</p>
  <p class="sub">portfolio demo</p>
  <span class="corner">Estrategia activa</span>
</body>
</html>
