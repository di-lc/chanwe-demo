<body class="page-newsletter" itemscope itemtype="https://schema.org/WebPage">
    <div data-component="nav"></div>

    <main id="main-content" role="main">
        <section class="cw-newsletter" id="newsletter-content" aria-label="Newsletter Chanwe">
            <!-- Hero -->
            <header class="cw-newsletter__hero">
                <div class="container cw-newsletter__container">
                    <div class="section-tag">Newsletter</div>
                    <h1 class="h2 page-title cw-newsletter__title">Análisis que llegan antes de que los necesites.</h1>
                    <p class="body-text page-lead cw-newsletter__lead">
                        Cada quince días, una lectura directa sobre lo que está moviendo los negocios en América Latina.
                        Sin relleno. Sin lo obvio.
                    </p>
                    <div class="cw-newsletter__divider" aria-hidden="true"></div>
                </div>
            </header>

            <!-- Form -->
            <section class="cw-newsletter__section cw-newsletter__section--base" aria-label="Suscripción">
                <div class="container cw-newsletter__container">
                    <div class="cw-newsletter__form-wrap">
                        <form class="cw-newsletter__form" action="#" method="post">
                            <div class="cw-newsletter__form-header">
                                <h2 class="h3 cw-newsletter__form-title">Suscribite a la newsletter</h2>
                            </div>

                            <div class="cw-newsletter__fields">
                                <div class="cw-newsletter__field">
                                    <label class="form-label" for="newsletter-name">Tu nombre</label>
                                    <input class="form-input" id="newsletter-name" name="name" type="text"
                                        autocomplete="name" placeholder="Juan García" required aria-describedby="newsletter-name-error">
                                    <span class="form-error" id="newsletter-name-error" role="alert" hidden></span>
                                </div>

                                <div class="cw-newsletter__field">
                                    <label class="form-label" for="newsletter-email">Tu e-mail empresarial</label>
                                    <input class="form-input" id="newsletter-email" name="email" type="email"
                                        autocomplete="email" placeholder="tu@empresa.com" required aria-describedby="newsletter-email-error">
                                    <span class="form-error" id="newsletter-email-error" role="alert" hidden></span>
                                </div>
                            </div>

                            <p class="form-error form-error--summary" id="newsletter-form-error-summary" data-form-error-summary role="alert" aria-live="polite" hidden></p>
                            <button class="btn btn-primary cw-newsletter__submit" type="submit">Suscribirme</button>
                            <p id="newsletter-form-status" class="cw-newsletter__status body-text" role="status"
                                aria-live="polite" hidden></p>
                            <p class="form-hint cw-newsletter__microcopy">Sin spam. Cancelás cuando querés. Frecuencia
                                quincenal.</p>
                        </form>
                    </div>
                </div>
            </section>
        </section>
    </main>

    <div data-component="footer"></div>
</body>
