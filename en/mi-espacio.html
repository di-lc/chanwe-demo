<body class="page-mi-espacio" itemscope itemtype="https://schema.org/WebPage">

    <div data-component="nav"></div>

    <main id="main-content" role="main">

        <div class="section-tag">MY SPACE</div>

        <!-- Login -->
        <div class="login-card">

            <div class="login-card__logo">
                <img src="../assets/02-logo/chanwe-logo-red.svg" alt="Chanwe" width="100" height="20">
            </div>

            <h1 class="login-card__title">Access your space</h1>
            <p class="login-card__subtitle">Exclusive content for Chanwe clients.</p>

            <!-- Form -->
            <form class="login-form" onsubmit="return false;" novalidate>

                <div class="login-form__group">
                    <label class="login-form__label form-label" for="login-email">Email</label>
                    <input class="login-form__input form-input" type="email" id="login-email" name="email" placeholder="you@company.com" autocomplete="email" required>
                </div>

                <div class="login-form__group">
                    <label class="login-form__label form-label" for="login-password">Password</label>
                    <div class="login-form__password-wrap">
                        <input class="login-form__input form-input login-form__input--password" type="password" id="login-password" name="password" placeholder="Password" autocomplete="current-password" required>
                        <button type="button" class="login-form__toggle-password" id="toggle-password" aria-label="Show password" aria-pressed="false" aria-controls="login-password">
                            <img class="login-form__toggle-password-icon" id="password-toggle-icon" src="../assets/01-icons/general-icons/general-chanwe-icon-eye-closed.svg" width="22" height="22" alt="" aria-hidden="true">
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary login-form__submit">
                    Sign in
                </button>

                <a class="login-form__forgot" aria-disabled="true" tabindex="-1">Forgot your password?</a>

            </form>
        </div>

        <!-- Note -->
        <p class="login-note">
            Not a client yet?
            <a href="servicios.html" class="login-note__link">Explore our services</a>
        </p>

    </main>

    <div data-component="footer"></div>

</body>
